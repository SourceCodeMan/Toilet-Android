name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core rules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # `core` is a plain JVM module on purpose, so the rules of the game are
      # covered without an emulator anywhere in sight.
      - name: Test
        run: ./gradlew :core:test
